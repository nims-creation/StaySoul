name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent the backend from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          # The BACKEND_LIVE_URL should be added to your GitHub Repository Secrets
          # Or you can replace ${{ secrets.BACKEND_LIVE_URL }} directly with your backend URL
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" ${{ secrets.BACKEND_LIVE_URL }}
