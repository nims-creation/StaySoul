spring.application.name=StaySoul

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/StaySoul}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update  
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration - Railway sets $PORT automatically
server.port=${PORT:8080}


server.servlet.context-path=/api/v1

jwt.secretKey=${JWT_SECRET_KEY}

frontend.url=${FRONTEND_URL:http://localhost:5173}

stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

# ===== OAuth2 Google Login =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:missing-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:missing-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===== Email Configuration (Gmail SMTP) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-email-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

server.error.include-message=always
# SECURITY: Never expose stack traces or exception class in production responses
server.error.include-stacktrace=never
server.error.include-exception=false